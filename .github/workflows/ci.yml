name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegisops
          POSTGRES_PASSWORD: aegisops
          POSTGRES_DB: aegisops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisops -d aegisops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://aegisops:aegisops@localhost:5432/aegisops

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry==2.4.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install backend dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff
        run: poetry run ruff check app tests

      - name: mypy
        run: poetry run mypy app

      - name: pytest
        run: poetry run pytest tests -q

      - name: Start backend
        run: |
          poetry run uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Verify /health
        run: |
          for i in {1..15}; do
            output=$(curl -s http://127.0.0.1:8000/health || echo "{}")
            status=$(python -c "import sys, json; data=json.loads(sys.stdin.read()); print(data.get('status', ''))" <<< "$output")
            version=$(python -c "import sys, json; data=json.loads(sys.stdin.read()); print(data.get('version', ''))" <<< "$output")
            if [ "$status" = "ok" ] && [ "$version" = "0.1.0" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed or timed out"
          exit 1

      - name: Verify /ready
        run: |
          for i in {1..15}; do
            output=$(curl -s http://127.0.0.1:8000/ready || echo "{}")
            status=$(python -c "import sys, json; data=json.loads(sys.stdin.read()); print(data.get('status', ''))" <<< "$output")
            if [ "$status" = "ready" ]; then
              echo "Ready check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Ready check failed or timed out"
          exit 1

      - name: Backend diagnostics
        if: failure()
        run: cat backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid) || true
          fi

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Jest
        run: npm test

      - name: Build
        run: npm run build

  docker-core-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose --profile core config

      - name: Start core profile
        run: docker compose --profile core up -d

      - name: Verify core service health
        run: |
          wait_for_health() {
            local service="$1"
            echo "Waiting for $service to be healthy..."
            for i in {1..30}; do
              local cid
              cid=$(docker compose --profile core ps -q "$service")
              if [ -z "$cid" ]; then
                echo "$service container not found or exited early."
                exit 1
              fi
              local status
              status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "missing")
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy."
                return 0
              elif [ "$status" = "unhealthy" ]; then
                echo "$service became unhealthy."
                exit 1
              fi
              sleep 2
            done
            echo "$service health check timed out."
            exit 1
          }
          wait_for_health postgres
          wait_for_health redis

      - name: PostgreSQL functional check
        run: docker compose --profile core exec -T postgres pg_isready -U aegisops -d aegisops

      - name: Redis functional check
        run: |
          output=$(docker compose --profile core exec -T redis redis-cli ping | tr -d '\r')
          if [ "$output" != "PONG" ]; then
            echo "Redis ping failed: $output"
            exit 1
          fi

      - name: Core status
        run: docker compose --profile core ps

      - name: Core diagnostics
        if: failure()
        run: |
          docker compose --profile core ps
          docker compose --profile core logs --no-color postgres redis

      - name: Tear down core profile
        if: always()
        run: docker compose --profile core down -v --remove-orphans
