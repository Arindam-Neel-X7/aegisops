[tool.poetry]
name = "aegisops-backend"
version = "0.1.0"
description = "AegisOps Backend Service"
authors = ["AegisOps Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = { version = "^0.27.0", extras = ["standard"] }
sqlalchemy = { version = "^2.0.23", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.13.1"
pydantic = { version = "^2.5.0", extras = ["email"] }
pydantic-settings = "^2.0.0"
structlog = "^24.1.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
celery = { version = "^5.3.6", extras = ["redis"] }
redis = "^5.0.1"
httpx = { version = "^0.25.0", extras = ["http2"] }
aiokafka = "^0.14.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.2"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
types-passlib = "^1.0.4"
types-python-jose = { version = "^3.3.0", optional = true }
types-redis = "^4.5.5"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
